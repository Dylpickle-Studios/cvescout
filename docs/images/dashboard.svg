<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">CVE Scout dashboard preview</title>
  <desc id="desc">Example dashboard showing device, port, CVE, and scan-job summaries.</desc>
  <rect width="1200" height="720" fill="#10151c"/>
  <rect width="1200" height="64" fill="#0b1016"/>
  <text x="40" y="41" fill="#ffffff" font-family="system-ui,sans-serif" font-size="22" font-weight="700">CVE Scout</text>
  <g fill="#e8eef5" font-family="system-ui,sans-serif" font-size="14">
    <text x="875" y="39">Inventory</text><text x="953" y="39">Reports</text><text x="1020" y="39">Logs</text><text x="1070" y="39">Log out admin</text>
  </g>
  <g font-family="system-ui,sans-serif">
    <text x="40" y="112" fill="#e8eef5" font-size="28" font-weight="700">Network inventory</text>
    <text x="40" y="136" fill="#9eacbb" font-size="13">Allowed: 192.168.1.0/24</text>
    <rect x="1035" y="88" width="125" height="28" rx="5" fill="#2c3947"/><text x="1052" y="108" fill="#e8eef5" font-size="12">EXAMPLE DATA</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#fff">
    <rect x="585" y="126" width="132" height="35" rx="5" fill="#237ac1"/><text x="601" y="148">Rescan network</text>
    <rect x="727" y="126" width="132" height="35" rx="5" fill="#237ac1"/><text x="744" y="148">Rescan devices</text>
    <rect x="869" y="126" width="132" height="35" rx="5" fill="#237ac1"/><text x="890" y="148">Rescan ports</text>
    <rect x="1011" y="126" width="149" height="35" rx="5" fill="#237ac1"/><text x="1024" y="148">Rescan vulnerabilities</text>
  </g>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(40 185)"><rect width="265" height="84" rx="7" fill="#18212b" stroke="#2c3947"/><text x="18" y="39" fill="#e8eef5" font-size="30" font-weight="700">6</text><text x="18" y="63" fill="#9eacbb" font-size="13">Devices</text></g>
    <g transform="translate(325 185)"><rect width="265" height="84" rx="7" fill="#18212b" stroke="#2c3947"/><text x="18" y="39" fill="#e8eef5" font-size="30" font-weight="700">5</text><text x="18" y="63" fill="#9eacbb" font-size="13">Online</text></g>
    <g transform="translate(610 185)"><rect width="265" height="84" rx="7" fill="#18212b" stroke="#2c3947"/><text x="18" y="39" fill="#e8eef5" font-size="30" font-weight="700">14</text><text x="18" y="63" fill="#9eacbb" font-size="13">Open ports</text></g>
    <g transform="translate(895 185)"><rect width="265" height="84" rx="7" fill="#18212b" stroke="#2c3947"/><text x="18" y="39" fill="#e8eef5" font-size="30" font-weight="700">3</text><text x="18" y="63" fill="#9eacbb" font-size="13">CVE matches</text></g>
  </g>
  <text x="40" y="315" fill="#e8eef5" font-family="system-ui,sans-serif" font-size="20" font-weight="700">Devices</text>
  <g transform="translate(40 335)" font-family="system-ui,sans-serif">
    <rect width="1120" height="190" rx="7" fill="#18212b" stroke="#2c3947"/>
    <g fill="#9eacbb" font-size="11" font-weight="700"><text x="18" y="29">ADDRESS</text><text x="170" y="29">NAME</text><text x="340" y="29">VENDOR</text><text x="520" y="29">STATUS</text><text x="650" y="29">PORTS</text><text x="750" y="29">CVES</text><text x="850" y="29">LAST SEEN</text></g>
    <path d="M0 43H1120M0 92H1120M0 141H1120" stroke="#2c3947"/>
    <g font-size="13" fill="#e8eef5">
      <text x="18" y="73" fill="#65b5ff">192.168.1.1</text><text x="170" y="73">router.local</text><text x="340" y="73">OpenWrt</text><rect x="520" y="57" width="40" height="21" rx="11" fill="#174e32"/><text x="530" y="72" fill="#a9f3c8" font-size="11">up</text><text x="650" y="73">4</text><text x="750" y="73">1</text><text x="850" y="73">2026-10-29 14:30 UTC</text>
      <text x="18" y="122" fill="#65b5ff">192.168.1.12</text><text x="170" y="122">pi-zero.local</text><text x="340" y="122">Raspberry Pi</text><rect x="520" y="106" width="40" height="21" rx="11" fill="#174e32"/><text x="530" y="121" fill="#a9f3c8" font-size="11">up</text><text x="650" y="122">3</text><text x="750" y="122">0</text><text x="850" y="122">2026-10-29 14:30 UTC</text>
      <text x="18" y="171" fill="#65b5ff">192.168.1.20</text><text x="170" y="171">nas.local</text><text x="340" y="171">Synology</text><rect x="520" y="155" width="40" height="21" rx="11" fill="#174e32"/><text x="530" y="170" fill="#a9f3c8" font-size="11">up</text><text x="650" y="171">7</text><text x="750" y="171">2</text><text x="850" y="171">2026-10-29 14:29 UTC</text>
    </g>
  </g>
  <text x="40" y="570" fill="#e8eef5" font-family="system-ui,sans-serif" font-size="20" font-weight="700">Recent jobs</text>
  <g transform="translate(40 590)" font-family="system-ui,sans-serif">
    <rect width="1120" height="92" rx="7" fill="#18212b" stroke="#2c3947"/>
    <g fill="#9eacbb" font-size="11" font-weight="700"><text x="18" y="27">ID</text><text x="80" y="27">TASK</text><text x="230" y="27">TARGET</text><text x="370" y="27">STATUS</text><text x="510" y="27">MESSAGE</text></g>
    <path d="M0 42H1120" stroke="#2c3947"/>
    <g fill="#e8eef5" font-size="13"><text x="18" y="70">42</text><text x="80" y="70">vulnerabilities</text><text x="230" y="70">all</text><rect x="370" y="54" width="75" height="22" rx="11" fill="#174e32"/><text x="381" y="69" fill="#a9f3c8" font-size="11">completed</text><text x="510" y="70">Profiled 14 ports; matched 3 CVEs</text></g>
  </g>
</svg>
