name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: python -m mypy
      - name: Compile
        run: python -m compileall -q cvescout tests
      - name: Test
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report --fail-under=75
      - name: Install nmap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nmap
      - name: Nmap smoke test
        run: |
          command -v nmap
          python -m unittest tests.test_nmap_smoke -v
      - name: Build wheel
        run: |
          mkdir -p dist
          python -m pip wheel --no-deps . -w dist
